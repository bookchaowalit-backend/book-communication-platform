name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out platform-notifications-api (pinned, for server-parity tests)
        uses: actions/checkout@v4
        with:
          repository: bookchaowalit/platform-notifications-api
          ref: 57dd0975442f469a2bc3443740974454801fde39
          path: _upstream/platform-notifications-api
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify vendored schema matches pinned canonical
        run: python3 scripts/check_schema_pin.py

      - name: Run offline contract check and tests
        env:
          PLATFORM_NOTIFICATIONS_API: ${{ github.workspace }}/_upstream/platform-notifications-api
          REQUIRE_SERVER_PARITY: "1"
        run: bash scripts/check.sh
